// CI only. Resolves the Sentry Gradle plugin directly from Maven Central under its real coordinates,
// io.sentry:sentry-android-gradle-plugin:<same version>, instead of through its plugin marker on the
// Gradle plugin portal. That marker answered 404 for 6.14.0 from the CI runners on 18-19 November 2026
// (both checked with curl in the failing run of e46d0b8a), while Maven Central has the plugin itself.
// The plugin and its version are unchanged: the marker only points to this same module.
beforeSettings { settings ->
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id == 'io.sentry.android.gradle') {
            useModule("io.sentry:sentry-android-gradle-plugin:${requested.version}")
        }
    }
}

// CI only. Google's mirror of Maven Central, consulted only after Maven Central (and Google's own
// repository) answered "not found". On 20 November 2026 Maven Central answered 404 for
// com.google.guava:guava:33.7.2-android (security update GHSA-xxph-c9ww-hj94) to the unit-test job
// while the build job of the same run downloaded it (run 44666891660); Gradle then remembers the
// miss, so retrying cannot help. The mirror serves the same Maven Central artifacts; added after the
// project's repositories, it never replaces one Maven Central answers.
// After Maven Central answered 429 (rate limit), gradle-retry.sh sets PLUS_CENTRAL_MIRROR_FIRST=1
// for the next attempt: the mirror is then asked first, since Gradle stops asking a repository for
// the rest of a build once it answered 429 and never falls back on such an error.
settingsEvaluated { settings ->
    def repositories = settings.dependencyResolutionManagement.repositories
    def mirror = repositories.maven {
        name = 'MavenCentralGoogleMirror'
        url = 'https://maven-central.storage-download.googleapis.com/maven2/'
        mavenContent { releasesOnly() }
    }
    if (System.getenv('PLUS_CENTRAL_MIRROR_FIRST') == '1') {
        repositories.remove(mirror)
        repositories.addFirst(mirror)
        println 'Maven Central rate-limited this runner: asking its Google mirror first.'
    }
}
