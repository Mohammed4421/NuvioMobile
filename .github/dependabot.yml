# Proposes updates of the GitHub Actions the workflows pin by commit SHA (see docs/plus/actions.md).
# Only pull requests: nothing is merged without the checks and the owner.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: custom-subtitles
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ['*']
