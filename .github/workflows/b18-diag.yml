name: B18 APK size diagnostics (temporary, never merged)
on:
  push:
    branches: [plus-diag/b18-apk-size]
permissions:
  contents: read
  actions: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Analyse the base APK
        run: |
          set -euo pipefail
          gh run download 45765389751 --repo "${GITHUB_REPOSITORY}" --name nuvio-plus-apk --dir signed
          ls -la signed
          apk="$(ls signed/NuvioPlus-build*-arm64-v8a.apk | head -n1)"
          echo "APK: $apk $(stat -c %s "$apk")"
          python3 - "$apk" <<'PY'
          import sys, zipfile, collections
          z = zipfile.ZipFile(sys.argv[1])
          top = collections.Counter(); unc = collections.Counter()
          for i in z.infolist():
              k = i.filename.split('/')[0] if '/' in i.filename else i.filename
              if i.filename.startswith('lib/'): k = i.filename
              if i.filename.startswith('assets/') or i.filename.startswith('composeResources'):
                  k = '/'.join(i.filename.split('/')[:3])
              top[k] += i.compress_size; unc[k] += i.file_size
          for k, v in top.most_common(60):
              print(f"{v:>11} {unc[k]:>11}  {k}")
          PY
          AA="$(ls -d ${ANDROID_HOME}/cmdline-tools/*/bin | head -n1)/apkanalyzer"
          echo "=== dex packages (defined, top) ==="
          "$AA" dex packages --defined-only "$apk" 2>/dev/null | awk '$1=="P"' | sort -k5 -n -r | awk '{print $5, $6}' | awk -F'[ .]' '{n=split($0,a," "); print}' | head -400 > pk.txt || true
          python3 - <<'PY'
          import collections
          agg = collections.Counter()
          for line in open('pk.txt'):
              parts = line.split()
              if len(parts) < 2: continue
              size, name = int(parts[0]), parts[1]
              seg = name.split('.')
              key = '.'.join(seg[:3]) if len(seg) >= 3 else name
              if name.count('.') == 2 or len(seg) == 3: agg[key] = max(agg[key], size)
          for k, v in agg.most_common(40): print(f"{v:>10} {k}")
          PY
          echo "=== raw top packages ==="; head -60 pk.txt
