name: B18 APK size diagnostics (temporary, never merged)
on:
  push:
    branches: [plus-diag/b18-apk-size]
permissions:
  contents: read
  actions: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Analyse the base APK
        run: |
          set -euo pipefail
          gh run download 45765389751 --repo "${GITHUB_REPOSITORY}" --name nuvio-plus-apk --dir signed
          ls -la signed
          apk="$(ls signed/NuvioPlus-build*-arm64-v8a.apk | head -n1)"
          echo "APK: $apk $(stat -c %s "$apk")"
          mkdir x && (cd x && unzip -q "../$apk")
          echo "=== composeResources by folder ==="
          du -ab x/composeResources 2>/dev/null | sort -n -r | head -5 || true
          find x -path '*composeResources*' -type f | awk -F/ '{print $(NF-1)}' | sort | uniq -c | sort -rn | head -60
          find x -path '*composeResources*' -type f -printf '%s %p\n' | sort -rn | head -40
          echo "=== strings per locale ==="
          find x -path '*composeResources*' -name '*.cvr' -printf '%s %h\n' | sort -rn | head -60
          echo "=== native strip potential ==="
          ST="$(ls ${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip)"
          echo "strip: $ST"; ls ${ANDROID_HOME}/ndk || true
          for f in x/lib/arm64-v8a/*.so; do
            cp "$f" s.so; "$ST" --strip-unneeded s.so 2>/dev/null || true
            a=$(stat -c %s "$f"); b=$(stat -c %s s.so)
            ga=$(gzip -9c "$f" | wc -c); gb=$(gzip -9c s.so | wc -c)
            echo "$(basename $f) raw $a -> $b ; gz $ga -> $gb ; $(readelf -S "$f" | grep -c debug) debug sections"
          done
