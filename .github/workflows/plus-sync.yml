name: Nuvio Plus safe upstream sync

# Safe Upstream Sync v2. For a new Nuvio release it:
#   1. creates a review branch plus-review/nuvio-<tag> from the target branch (custom-subtitles for
#      stable Nuvio releases, plus-beta for betas) and merges the release there, nowhere else;
#   2. writes a review record (.github/plus/reviews/nuvio-<tag>.md) mapping Nuvio's changes to the
#      Nuvio Plus feature registry: Git conflicts, touched features, possible duplicates, Nuvio CI and
#      build files;
#   3. builds and checks the review branch (never publishes);
#   4. opens a pull request into the target branch.
# Nothing reaches custom-subtitles or plus-beta without a person merging that pull request, and the
# publish workflow refuses to publish while a review record is not approved for a tested commit.
# An existing review branch is never rewritten.
on:
  workflow_call:
    inputs:
      channel:
        description: stable (default) or beta
        type: string
        default: stable

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: https://github.com/NuvioMedia/NuvioMobile.git

jobs:
  prepare:
    name: Merge the Nuvio release into a review branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.merge.outputs.status }}
      tag: ${{ steps.merge.outputs.tag }}
      branch: ${{ steps.merge.outputs.branch }}
      target: ${{ steps.merge.outputs.target }}
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Nuvio Plus
        uses: actions/checkout@v6
        with:
          ref: custom-subtitles
          fetch-depth: 0

      - name: Merge into the review branch
        id: merge
        run: |
          set -euo pipefail
          channel="${{ inputs.channel }}"
          [[ "${channel}" == beta ]] || channel=stable
          target=custom-subtitles
          [[ "${channel}" == beta ]] && target=plus-beta
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          cp .github/plus/select-upstream-tag.py .github/plus/upstream-review.py .github/plus/features.json "${RUNNER_TEMP}/"

          git remote add upstream "${UPSTREAM}"
          tag="$(git ls-remote --tags upstream | python3 "${RUNNER_TEMP}/select-upstream-tag.py" "${channel}")"
          [[ -n "${tag}" ]] || { echo "status=none" >> "${GITHUB_OUTPUT}"; exit 0; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          git fetch --no-tags upstream "refs/tags/${tag}:refs/tags/${tag}"

          # The beta branch starts from stable Nuvio Plus the first time.
          if git ls-remote --exit-code --heads origin "${target}" > /dev/null; then
            git fetch origin "${target}"
            git switch --quiet --detach "origin/${target}"
          fi
          if git merge-base --is-ancestor "${tag}^{commit}" HEAD; then
            echo "Nuvio Plus (${target}) already includes Nuvio ${tag}."
            echo "status=current" >> "${GITHUB_OUTPUT}"; exit 0
          fi

          branch="plus-review/nuvio-${tag}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --heads origin "${branch}" > /dev/null; then
            # Never rewrite a review branch: it may hold a person's fixes.
            echo "${branch} already exists; leaving it as it is."
            echo "status=exists" >> "${GITHUB_OUTPUT}"; exit 0
          fi

          git switch --quiet -c "${branch}"
          base_head="$(git rev-parse HEAD)"
          : > conflicts.txt
          if git merge --no-edit -m "Merge Nuvio ${tag} into ${target} for review" "${tag}^{commit}"; then
            # Nuvio's CI files are listed in the review record and not applied (this token may not
            # push workflow changes, and Nuvio Plus runs its own CI).
            git diff --name-only "${base_head}" HEAD -- .github > nuvio-ci-changes.txt || true
            if [[ -s nuvio-ci-changes.txt ]]; then
              git checkout "${base_head}" -- .github
              git diff --name-only --diff-filter=A "${base_head}" HEAD -- .github | xargs -r git rm -q
              git commit --amend --no-edit
            fi
            status=merged
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            # The branch starts from the target; the merge is done by hand on it.
            status=conflict
          fi

          mkdir -p .github/plus/reviews
          record=".github/plus/reviews/nuvio-${tag}.md"
          python3 "${RUNNER_TEMP}/upstream-review.py" "${base_head}" "${tag}^{commit}" "${tag}" "${target}" conflicts.txt "${record}" > /dev/null || true
          if [[ "${status}" == conflict ]]; then
            printf '\n## How to continue\n\nOn this branch: `git merge %s`, resolve the files above, commit, push. The checks run on every push.\n' "${tag}" >> "${record}"
          fi
          git add "${record}"
          git commit --quiet -m "Review record for Nuvio ${tag}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          cp "${record}" review.md

      - name: Keep the review record
        if: steps.merge.outputs.branch != ''
        uses: actions/upload-artifact@v7
        with:
          name: review-record
          path: review.md
          if-no-files-found: ignore

  checks:
    name: Build and check the review branch
    needs: prepare
    if: needs.prepare.outputs.status == 'merged'
    uses: Mohammed4421/NuvioMobile/.github/workflows/plus-build.yml@custom-subtitles
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      publish: false
      channel: ${{ inputs.channel == 'beta' && 'beta' || 'stable' }}
    secrets: inherit

  pull-request:
    name: Open the review pull request
    needs: [prepare, checks]
    if: always() && (needs.prepare.outputs.status == 'merged' || needs.prepare.outputs.status == 'conflict')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      TARGET: ${{ needs.prepare.outputs.target }}
      SHA: ${{ needs.prepare.outputs.sha }}
      STATUS: ${{ needs.prepare.outputs.status }}
      CHECKS: ${{ needs.checks.result }}
    steps:
      - name: Get the review record
        uses: actions/download-artifact@v8
        with:
          name: review-record

      - name: Open the pull request (or report it)
        run: |
          {
            echo "Nuvio ${TAG} merged into \`${BRANCH}\` for review. Nothing changes in \`${TARGET}\` until this is merged by a person."
            echo
            if [[ "${STATUS}" == conflict ]]; then
              echo "**Git conflicts:** the merge has to be finished by hand on this branch (see the record)."
            else
              echo "**Checks of ${SHA::7}:** ${CHECKS}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            fi
            echo
            echo "Publishing stays blocked until \`.github/plus/reviews/nuvio-${TAG}.md\` is approved for a tested commit."
            echo
            cat review.md
          } > body.md
          # Create the target branch the first time (beta starts from stable Nuvio Plus).
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${TARGET}" > /dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${TARGET}" \
              -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/custom-subtitles" --jq .commit.sha)" > /dev/null
          fi
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" -f title="Nuvio ${TAG} → ${TARGET} (review)" \
               -f head="${BRANCH}" -f base="${TARGET}" -F draft=true -F body=@body.md --jq .html_url; then
            exit 0
          fi
          # Pull requests from Actions may be turned off in the repository settings: report instead.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="review-nuvio-${TAG}" \
            -f target_commitish="${SHA}" -f name="Nuvio ${TAG} waiting for review" -F prerelease=true \
            -F body=@body.md > /dev/null
          echo "::warning::Could not open a pull request; the review is published as the pre-release review-nuvio-${TAG}."
