name: Build Custom APK

# Builds a personal, signed release APK of this branch. Run it from the Actions tab.
on:
  push:
    branches: [custom-subtitles]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build custom APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing and properties
        env:
          # Optional secrets. Without CUSTOM_KEYSTORE_BASE64 a new key is made on every run,
          # so each new APK has to replace the previous one by uninstalling it first.
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.CUSTOM_KEYSTORE_BASE64 }}
          CUSTOM_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_KEYSTORE_PASSWORD }}
          # Optional extra local.properties lines (Trakt, Simkl, Supabase keys and so on).
          CUSTOM_LOCAL_PROPERTIES: ${{ secrets.CUSTOM_LOCAL_PROPERTIES }}
        run: |
          keystore="${RUNNER_TEMP}/custom-release.jks"
          if [[ -n "${CUSTOM_KEYSTORE_BASE64}" ]]; then
            printf '%s' "${CUSTOM_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            password="${CUSTOM_KEYSTORE_PASSWORD}"
          else
            password="custom-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "${keystore}" -storepass "${password}" -keypass "${password}" \
              -alias custom -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Custom"
          fi
          printf '%s\n' "${CUSTOM_LOCAL_PROPERTIES}" > local.properties
          {
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${password}"
            echo "NUVIO_RELEASE_KEY_ALIAS=custom"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${password}"
          } >> local.properties

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pnuvio.applicationIdSuffix=.plus \
            --stacktrace 2>&1 | tee build.log

      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${GITHUB_RUN_NUMBER} failed at ${GITHUB_SHA}."
            echo
            echo '```'
            grep -E "^e: |^w: .*error|error:|What went wrong|Execution failed|Unresolved reference|> Task .*FAILED" -A4 build.log | head -c 90000 || true
            echo '```'
            echo
            echo '```'
            tail -n 60 build.log | head -c 20000
            echo '```'
          } > errors.md
          gh release create "build-failed-${GITHUB_RUN_NUMBER}" build.log \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Build ${GITHUB_RUN_NUMBER} failed" \
            --notes-file errors.md

      - name: Name the APKs
        run: |
          mkdir -p dist
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            abi="$(basename "${apk}" .apk | sed -E 's/^androidApp-full-//; s/-release$//')"
            cp "${apk}" "dist/NuvioPlus-build${GITHUB_RUN_NUMBER}-${abi}.apk"
          done
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-plus-build${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Unofficial build of Nuvio Mobile with subtitle and download improvements."
            echo
            echo "**Install:** \`NuvioPlus-build${GITHUB_RUN_NUMBER}-arm64-v8a.apk\` fits most phones and tablets. Uninstall the previous Nuvio Plus build first (each build is signed with a new key)."
            echo
            # The newest section of the changelog.
            awk '/^## /{n++} n==1' CHANGELOG.md | sed '1s/^## /### /'
            echo
            echo "Full list: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md) · Commit: ${GITHUB_SHA::7}"
          } > release-notes.md
          gh release create "custom-${GITHUB_RUN_NUMBER}" dist/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Nuvio Plus · build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            --latest
