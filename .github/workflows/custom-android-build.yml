name: Build Custom APK

# Every push to the stable Nuvio Plus branch is built and checked; the APKs are published only
# when every check passes (see plus-build.yml).
on:
  push:
    branches: [custom-subtitles]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      allow_key_change:
        description: Accept a new signing certificate (users then reinstall once)
        type: boolean
        default: false

concurrency:
  group: nuvio-plus-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/plus-build.yml
    with:
      ref: ${{ github.sha }}
      publish: true
      allow_key_change: ${{ inputs.allow_key_change || false }}
    secrets: inherit
