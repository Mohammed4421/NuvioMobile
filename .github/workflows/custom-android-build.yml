name: Build Custom APK

# Publishing builds. A push to custom-subtitles or plus-beta (a merged pull request) builds and checks
# the branch and is never published, so merging a series of pull requests cannot release a partial
# build. A release is published only by running this workflow by hand on the branch with
# release_commit set to the branch head (docs/plus/release.md): then every check passes
# (plus-build.yml), the review gate confirms with GitHub that the commit came through a tested pull
# request merged by the owner, and the owner approves signing and publishing.
#
# Only the publish and report-failure jobs can write to the repository; they run no Gradle and use
# the APKs the checks signed, verified against the digest list from the sign job.
on:
  push:
    branches: [custom-subtitles, plus-beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_commit:
        description: "The full commit of the branch head (40 hex)."
        required: true
        type: string
      validation_only:
        description: "Sign and test the candidate with approval, without publishing a release."
        type: boolean
        default: false

# Releases queue one after another. Checks after a merge have their own queue, so a release waiting
# for the owner's approval never holds them up (and they never publish).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'nuvio-plus-publish' || format('nuvio-plus-verify-{0}', github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  branch:
    name: Publishing branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only custom-subtitles and plus-beta publish
        run: |
          case "${GITHUB_REF}" in
            refs/heads/custom-subtitles|refs/heads/plus-beta) echo "Publishing from ${GITHUB_REF_NAME}." ;;
            *) echo "::error::${GITHUB_REF} is not a publishing branch; nothing is published."; exit 1 ;;
          esac

  checks:
    needs: branch
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/plus-build.yml
    with:
      ref: ${{ github.sha }}
      channel: ${{ github.ref_name == 'plus-beta' && 'beta' || 'stable' }}
      status_sha: ${{ github.sha }}
      status_prefix: nuvio-plus/publish
    # Only the public app settings, and only on the publishing branches (never on review branches);
    # the build checks every name before any code of the commit runs. No signing secret is passed.
    secrets:
      CUSTOM_LOCAL_PROPERTIES: ${{ secrets.CUSTOM_LOCAL_PROPERTIES }}

  review-gate:
    name: Reviewed and tested pull request
    needs: branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Forget the checkout token
        # Inline, not a script of the commit: nothing of the commit has run yet. (persist-credentials:
        # false is not used because actions/checkout then fails on Nuvio's libass-android gitlink,
        # which has no URL in .gitmodules.)
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Check with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PLUS_APPROVERS: ${{ github.repository_owner }}
        run: |
          git fetch --quiet --no-tags https://github.com/NuvioMedia/NuvioMobile.git '+refs/tags/*:refs/tags/*'
          python3 .github/plus/review-gate.py publish

      - name: Release scope (S12-02)
        # Only a hand-started release run: docs/plus/build15/release-scope.json against GitHub and
        # this exact commit (pull requests merged and contained, the trial merge excluded, branch not
        # moved, the requirements gate passed on this commit). Any mismatch publishes nothing.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/plus/release-scope-check.py

  release-identity:
    name: Release signing identity
    # Runs no file of the commit (no checkout) and holds no secret: only whether a legacy private key
    # secret exists (true/false) reaches it. Decides whether this build moves on to release signing.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      identity: ${{ steps.decide.outputs.identity }}
      compromised: ${{ steps.decide.outputs.compromised }}
    env:
      CERTIFICATE: ${{ needs.checks.outputs.certificate }}
      PRIVATE_KEY_CONFIGURED: ${{ secrets.CUSTOM_KEYSTORE_BASE64 != '' }}
      # Certificate of builds 8-12. Their key (signing/nuvio-plus.p12) is in the repository with its
      # password, so it is treated as compromised: the checks sign test builds with it, and an APK
      # signed with it alone is never published.
      COMPROMISED: 40335e3135578dd858dc434717b9344015b62872dcb861d52474c38a1f99f48a
      # Certificate of the release key (docs/plus/signing-migration.md), made on 2026-11-19 by
      # plus-release-key.yml (run 44534502910). Only APKs signed with it are published.
      RELEASE_IDENTITY: 99c0a98cc1700bd1186018e480eab670daaf55d4d8c5316d7cf03d788d431e35
      # Only a hand-started run that names the exact commit it publishes goes on to release signing.
      EVENT: ${{ github.event_name }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      - name: Tested with the public test key; a release key is pinned
        id: decide
        run: |
          if [[ "${CERTIFICATE}" != "${COMPROMISED}" ]]; then
            echo "::error::The checks signed with ${CERTIFICATE:-nothing}, not the test key. Nothing is published."
            exit 1
          fi
          if [[ "${PRIVATE_KEY_CONFIGURED}" != false ]]; then
            echo "::error::A legacy private key secret (CUSTOM_KEYSTORE_BASE64) is configured. The release key lives only in the plus-release environment (docs/plus/signing-migration.md). Nothing is published."
            exit 1
          fi
          if [[ ! "${RELEASE_IDENTITY}" =~ ^[0-9a-f]{64}$ || "${RELEASE_IDENTITY}" == "${COMPROMISED}" ]]; then
            echo "::warning::Built and checked, not published: no release key is set up yet, and the public key never publishes (docs/plus/signing-migration.md)."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT}" != workflow_dispatch ]]; then
            echo "::notice::Built and checked after the merge; not published. To publish this commit, run this workflow by hand on ${GITHUB_REF_NAME} with release_commit=${GITHUB_SHA} (docs/plus/release.md)."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ || "${RELEASE_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "::error::release_commit (${RELEASE_COMMIT:-empty}) is not the branch head ${GITHUB_SHA}. Nothing is published."
            exit 1
          fi
          echo "Tested; moving on to release signing of ${GITHUB_SHA} with ${RELEASE_IDENTITY}."
          { echo "publish=true"; echo "identity=${RELEASE_IDENTITY}"; echo "compromised=${COMPROMISED}"; } >> "${GITHUB_OUTPUT}"

  release-sign:
    name: Release signing (protected key, owner's approval)
    # The only job that can read the release key: the plus-release environment holds it, allows only
    # the publishing branches and waits for the owner's approval. It runs no file of the commit: the
    # checkout holds only the old public key (for the lineage), and every command is written here.
    needs: [checks, review-gate, release-identity]
    if: needs.release-identity.outputs.publish == 'true'
    environment: plus-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.sign.outputs.manifest }}
    steps:
      - name: The branch head is still this commit
        # Inline, no file of the commit. The branch may have moved while the checks ran or the owner's
        # approval was pending: only the commit that is still the branch head is signed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)" \
            || { echo "::error::Could not read the head of ${GITHUB_REF_NAME}; nothing is signed."; exit 1; }
          if [[ ! "${head}" =~ ^[0-9a-f]{40}$ || "${head}" != "${GITHUB_SHA}" ]]; then
            echo "::error::${GITHUB_REF_NAME} is now at ${head:-nothing}, not ${GITHUB_SHA} (it moved after this run started). This stale commit is not signed; start a release for the new head."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is still at ${GITHUB_SHA}."

      - name: Check out the old public key only (for the lineage)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            signing/nuvio-plus.p12

      - name: Forget the checkout token
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the unsigned APKs the checks built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuvio-plus-built
          path: built

      - name: Sign for release (v3 with the lineage; Android 9+)
        id: sign
        env:
          EXPECTED: ${{ needs.checks.outputs.built_manifest }}
          IDENTITY: ${{ needs.release-identity.outputs.identity }}
          OLD: ${{ needs.release-identity.outputs.compromised }}
          OLD_PASSWORD: nuvio-plus-public
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${EXPECTED}" && "$(sha256sum built/built.sha256 | cut -c1-64)" == "${EXPECTED}" ]] \
            || { echo "::error::The unsigned APKs are not the ones the checks built"; exit 1; }
          (cd built && sha256sum --check --strict built.sha256)
          [[ "$(ls built/*.apk | wc -l)" -eq 4 ]] || { echo "::error::Expected 4 APKs"; exit 1; }
          [[ -s signing/nuvio-plus.p12 ]] || { echo "::error::signing/nuvio-plus.p12 is missing"; exit 1; }
          [[ -n "${RELEASE_KEYSTORE}" && -n "${RELEASE_KEY_PASSWORD}" ]] \
            || { echo "::error::The plus-release environment has no release key"; exit 1; }
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          umask 077
          key="$(mktemp -d)/release.p12"
          trap 'rm -rf "$(dirname "${key}")"' EXIT
          printf '%s' "${RELEASE_KEYSTORE}" | base64 -d > "${key}"
          unset RELEASE_KEYSTORE
          # The lineage: the old key's signature handing over to the release key (old key: rollback
          # off). The old key signs only this, never an APK.
          lineage="$(dirname "${key}")/lineage.bin"
          "${tools}/apksigner" rotate --out "${lineage}" \
            --old-signer --ks signing/nuvio-plus.p12 --ks-key-alias nuvio-plus --ks-pass env:OLD_PASSWORD --key-pass env:OLD_PASSWORD \
            --set-rollback false \
            --new-signer --ks "${key}" --ks-type PKCS12 --ks-key-alias nuvio-plus-release --ks-pass env:RELEASE_KEY_PASSWORD
          chain="$("${tools}/apksigner" lineage --in "${lineage}" --print-certs | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]\{64\}\).*/\1/p' | paste -sd' ')"
          [[ "${chain}" == "${OLD} ${IDENTITY}" ]] \
            || { echo "::error::The release key is not the pinned one (lineage: ${chain})"; exit 1; }
          mkdir -p release
          for apk in built/*.apk; do
            if unzip -Z1 "${apk}" | grep -qiE '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$'; then
              echo "::error::$(basename "${apk}") carries a v1 (JAR) signature; refusing to sign it"; exit 1
            fi
            aligned="$(dirname "${key}")/$(basename "${apk}")"
            if "${tools}/zipalign" -c 4 "${apk}" > /dev/null; then cp "${apk}" "${aligned}"; else "${tools}/zipalign" -f 4 "${apk}" "${aligned}"; fi
            "${tools}/apksigner" sign --ks "${key}" --ks-type PKCS12 --ks-pass env:RELEASE_KEY_PASSWORD \
              --ks-key-alias nuvio-plus-release --lineage "${lineage}" --min-sdk-version 28 --rotation-min-sdk-version 28 \
              --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false \
              --out "release/$(basename "${apk}")" "${aligned}" > /dev/null
            rm -f "${aligned}"
          done
          rm -f "${key}"
          cp built/checks-build.md release/
          (cd release && sha256sum *.apk > release.sha256)
          cat release/release.sha256
          echo "manifest=$(sha256sum release/release.sha256 | cut -c1-64)" >> "${GITHUB_OUTPUT}"

      - name: Keep the release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuvio-plus-release
          path: release
          if-no-files-found: error
          retention-days: 14

  release-verify:
    name: Release APKs (certificate, lineage, same contents as tested)
    needs: [checks, release-identity, release-sign]
    if: needs.release-identity.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_MANIFEST: ${{ needs.release-sign.outputs.manifest }}
      TESTED_MANIFEST: ${{ needs.checks.outputs.manifest }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Forget the checkout token
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the release and the tested APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuvio-plus-{release,apk}
          path: apks

      - name: Verify
        env:
          IDENTITY: ${{ needs.release-identity.outputs.identity }}
          OLD: ${{ needs.release-identity.outputs.compromised }}
        run: |
          set -o pipefail
          python3 -I .github/plus/release-verify.py --release apks/nuvio-plus-release --tested apks/nuvio-plus-apk \
            --release-manifest "${RELEASE_MANIFEST}" --tested-manifest "${TESTED_MANIFEST}" \
            --identity "${IDENTITY}" --old "${OLD}" | tee checks-release.md

      - name: Keep the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuvio-plus-release-verify
          path: checks-release.md
          if-no-files-found: error
          retention-days: 14

  release-upgrade:
    name: Update to the release on Android ${{ matrix.api }} (from the previous release and build 12)
    needs: [checks, release-identity, release-verify]
    if: needs.release-identity.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28, 34]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Forget the checkout token
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the release, the tested APKs and the device test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuvio-plus-{release,apk,update-device-test}
          path: apks

      - name: Get build 12 and the previous release; make an APK with a foreign key
        env:
          IDENTITY: ${{ needs.release-identity.outputs.identity }}
        run: |
          set -euo pipefail
          gh release download custom-12 --repo "${GITHUB_REPOSITORY}" --dir build12 --pattern '*x86_64*.apk' --clobber
          # The earlier releases users update from, each on its own (owner directive 2026-11-22):
          # Build 13 and Build 14, and the newest published one if it is another; all must be signed
          # with the release key.
          latest="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          previous=""
          for tag in custom-13 custom-14 "${latest}"; do
            [[ "${tag}" != custom-12 && ";${previous}" != *";${tag}="* ]] || continue
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir "previous/${tag}" --pattern '*x86_64*.apk' --clobber
            apk="$(ls "previous/${tag}"/*x86_64*.apk)"
            [[ "$(python3 -I .github/plus/apk-certs.py --current "${apk}")" == "${IDENTITY}" ]] \
              || { echo "::error::${tag} is not signed with the release key"; exit 1; }
            previous="${previous:+${previous};}${tag}=${apk}"
          done
          release="$(ls apks/nuvio-plus-release/*x86_64*.apk)"
          # Any other key: what a stranger could sign (generated here, thrown away with the job).
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "${RUNNER_TEMP}/foreign.p12" -storepass foreign-key \
            -alias foreign -keyalg EC -groupname secp256r1 -validity 2 -dname "CN=Not Nuvio Plus" > /dev/null 2>&1
          "${tools}/apksigner" sign --ks "${RUNNER_TEMP}/foreign.p12" --ks-pass pass:foreign-key \
            --min-sdk-version 28 --out "${RUNNER_TEMP}/foreign.apk" "${release}"
          {
            echo "BUILD12_APK=$(ls build12/*x86_64*.apk)"
            echo "PREVIOUS_APK=${previous}"
            echo "RELEASE_APK=${release}"
            echo "OLD_KEY_APK=$(ls apks/nuvio-plus-apk/*x86_64*.apk)"
            echo "FOREIGN_APK=${RUNNER_TEMP}/foreign.apk"
          } >> "${GITHUB_ENV}"
          echo "Earlier releases: $(echo "${previous}" | tr ';' '\n' | cut -d= -f1 | paste -sd' ')"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Update to the release (app check, installer, data)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -no-snapshot
          script: bash .github/plus/release-upgrade-test.sh "$BUILD12_APK" "$PREVIOUS_APK" "$RELEASE_APK" "$OLD_KEY_APK" "$FOREIGN_APK" apks/nuvio-plus-update-device-test/debug-app.apk apks/nuvio-plus-update-device-test/debug-test.apk

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuvio-plus-release-upgrade-api${{ matrix.api }}
          path: |
            checks-release-upgrade-api*.md
            release-upgrade.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish
    needs: [checks, review-gate, release-identity, release-sign, release-verify, release-upgrade]
    # Only APKs signed with the pinned release key, verified, and moved from build 12 on emulators.
    if: github.event_name == 'workflow_dispatch' && inputs.validation_only == false && needs.release-identity.outputs.publish == 'true'
    # A second approval by the owner, after every test above passed. It reads no secret of the
    # environment (none is referenced here); the environment only makes it wait for the owner.
    environment: plus-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Forget the checkout token
        # Inline, not a script of the commit: nothing of the commit has run yet. (persist-credentials:
        # false is not used because actions/checkout then fails on Nuvio's libass-android gitlink,
        # which has no URL in .gitmodules.)
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the release APKs and the check results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuvio-plus-{release,update-check,emulator,gate,release-verify,release-upgrade-api*}
          merge-multiple: true
          path: dist

      - name: Check they are the APKs that were signed for release and verified
        env:
          EXPECTED: ${{ needs.release-sign.outputs.manifest }}
          identity: ${{ needs.release-identity.outputs.identity }}
        run: |
          [[ -n "${EXPECTED}" && "$(sha256sum dist/release.sha256 | cut -c1-64)" == "${EXPECTED}" ]] \
            || { echo "::error::The APK list does not match the release signing job"; exit 1; }
          (cd dist && sha256sum --check --strict release.sha256)
          [[ "$(ls dist/*.apk | wc -l)" -eq 4 ]] || { echo "::error::Expected 4 APKs"; exit 1; }
          [[ "${identity}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No release identity pinned"; exit 1; }
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          for apk in dist/*.apk; do
            "${tools}/apksigner" verify --min-sdk-version 28 "${apk}"
            cert="$(python3 -I .github/plus/apk-certs.py --current "${apk}")"
            [[ "${cert}" == "${identity}" ]] || { echo "::error::${apk} is not signed with the release key"; exit 1; }
          done

      - name: Mandatory pre-release readiness (P0–P9)
        # Signing and the upgrade matrix run before this final publication guard because
        # their results are themselves required release evidence. The previous build remains
        # published when a required requirement or owner-approved phase gate is incomplete.
        # Owner-only personal device checks remain a separate post-release obligation.
        run: python3 -I .github/plus/release-readiness-check.py

      - name: The branch head is still this commit
        # Inline, no file of the commit. The branch may have moved while the checks ran or the owner's
        # approval was pending: only the commit that is still the branch head is published.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)" \
            || { echo "::error::Could not read the head of ${GITHUB_REF_NAME}; nothing is published."; exit 1; }
          if [[ ! "${head}" =~ ^[0-9a-f]{40}$ || "${head}" != "${GITHUB_SHA}" ]]; then
            echo "::error::${GITHUB_REF_NAME} is now at ${head:-nothing}, not ${GITHUB_SHA} (it moved after this run started). This stale commit is not published; start a release for the new head."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is still at ${GITHUB_SHA}."

      - name: Publish release
        env:
          PLUS_CHANNEL: ${{ github.ref_name == 'plus-beta' && 'beta' || 'stable' }}
          BUILD: ${{ needs.checks.outputs.build_number }}
        run: bash .github/plus/publish-release.sh "${BUILD}" "${GITHUB_SHA}" dist

  report-failure:
    name: Report a failed build
    needs: [branch, checks, review-gate, release-identity, release-sign, release-verify, release-upgrade, publish]
    if: failure() && needs.branch.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reports in the run itself (summary and an artifact with the logs), never as a GitHub release:
    # releases are only what was published.
    permissions: {}
    env:
      BUILD: ${{ needs.checks.outputs.build_number }}
      RESULTS: "Checks: ${{ needs.checks.result }} · Review gate: ${{ needs.review-gate.result }} · Signing identity: ${{ needs.release-identity.result }} · Release signing: ${{ needs.release-sign.result }} · Verify: ${{ needs.release-verify.result }} · Update tests: ${{ needs.release-upgrade.result }} · Publish: ${{ needs.publish.result }}"
    steps:
      - name: Get the logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: '*log*'
          merge-multiple: true
          path: logs

      - name: Write the failure report (no release)
        run: |
          build="${BUILD:-run${GITHUB_RUN_NUMBER}}"
          [[ "${build}" =~ ^(run)?[0-9]+$ ]] || build="run${GITHUB_RUN_NUMBER}"
          {
            echo "Build ${build} at \`${GITHUB_SHA::7}\` did not pass its checks or gates, so nothing was published. The previous build stays current."
            echo
            echo "${RESULTS}"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat logs/build.log logs/tests.log 2>/dev/null \
              | grep -E "^e: |error:|What went wrong|Execution failed|Unresolved reference|FAILED|> Task .*FAILED|AssertionError" -A3 \
              | head -c 60000 || true
            echo '```'
            if [[ -f logs/emulator.log ]]; then
              echo
              echo "Emulator log (end):"
              echo '```'
              tail -n 80 logs/emulator.log
              echo '```'
            fi
          } > errors.md
          cat errors.md >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::Build ${build} was not published. The report is in this run's summary and in the nuvio-plus-failure-report artifact."

      - name: Keep the report with the logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuvio-plus-failure-report
          path: |
            errors.md
            logs/
          if-no-files-found: warn
          retention-days: 90
