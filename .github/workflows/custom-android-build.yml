name: Build Custom APK

# Publishing builds. A push to custom-subtitles publishes a stable release, a push to plus-beta a
# beta pre-release, and only when every check passes (plus-build.yml) and the review gate confirms
# with GitHub that the commit came through a tested pull request merged by the owner.
#
# Only the publish and report-failure jobs can write to the repository; they run no Gradle and use
# the APKs the checks signed, verified against the digest list from the sign job.
on:
  push:
    branches: [custom-subtitles, plus-beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      allow_key_change:
        description: Accept a new signing certificate (users then reinstall once)
        type: boolean
        default: false

concurrency:
  group: nuvio-plus-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  branch:
    name: Publishing branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only custom-subtitles and plus-beta publish
        run: |
          case "${GITHUB_REF}" in
            refs/heads/custom-subtitles|refs/heads/plus-beta) echo "Publishing from ${GITHUB_REF_NAME}." ;;
            *) echo "::error::${GITHUB_REF} is not a publishing branch; nothing is published."; exit 1 ;;
          esac

  checks:
    needs: branch
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/plus-build.yml
    with:
      ref: ${{ github.sha }}
      channel: ${{ github.ref_name == 'plus-beta' && 'beta' || 'stable' }}
      allow_key_change: ${{ inputs.allow_key_change || false }}
      status_sha: ${{ github.sha }}
      status_prefix: nuvio-plus/publish
    # Only the public app settings, and only on the publishing branches (never on review branches);
    # the build checks every name before any code of the commit runs. No signing secret is passed.
    secrets:
      CUSTOM_LOCAL_PROPERTIES: ${{ secrets.CUSTOM_LOCAL_PROPERTIES }}

  review-gate:
    name: Reviewed and tested pull request
    needs: branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Forget the checkout token
        # Inline, not a script of the commit: nothing of the commit has run yet. (persist-credentials:
        # false is not used because actions/checkout then fails on Nuvio's libass-android gitlink,
        # which has no URL in .gitmodules.)
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Check with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PLUS_APPROVERS: ${{ github.repository_owner }}
        run: |
          git fetch --quiet --no-tags https://github.com/NuvioMedia/NuvioMobile.git '+refs/tags/*:refs/tags/*'
          python3 .github/plus/review-gate.py publish

  release-identity:
    name: Release signing identity
    # Runs no file of the commit (no checkout) and holds no secret: only whether a private key is
    # configured (true/false) reaches it.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    env:
      CERTIFICATE: ${{ needs.checks.outputs.certificate }}
      PRIVATE_KEY_CONFIGURED: ${{ secrets.CUSTOM_KEYSTORE_BASE64 != '' }}
      # Certificate of builds 8-12. Their key (signing/nuvio-plus.p12) is in the repository with its
      # password, so it is treated as compromised: builds signed with it are checked, never published.
      COMPROMISED: 40335e3135578dd858dc434717b9344015b62872dcb861d52474c38a1f99f48a
      # Certificate of the release key that replaces it (docs/plus/signing-migration.md). Empty until
      # the owner approves the migration and the key exists, so nothing can be published.
      RELEASE_IDENTITY: ""
    steps:
      - name: Signed with the approved release key, never the public one
        id: decide
        run: |
          if [[ ! "${CERTIFICATE}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::No signing certificate from the checks; nothing is published."
            exit 1
          fi
          if [[ "${PRIVATE_KEY_CONFIGURED}" != false ]]; then
            echo "::error::A private signing key (CUSTOM_KEYSTORE_BASE64) is configured, but the key migration is not set up (docs/plus/signing-migration.md). Nothing is published."
            exit 1
          fi
          if [[ "${CERTIFICATE}" == "${COMPROMISED}" ]]; then
            echo "::warning::Built and checked, not published: signed with the key of builds 8-12, which is public and treated as compromised. Publishing needs the new release key (docs/plus/signing-migration.md)."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -z "${RELEASE_IDENTITY}" || "${CERTIFICATE}" != "${RELEASE_IDENTITY}" ]]; then
            echo "::error::The APKs are signed with ${CERTIFICATE}, not the approved release key. Nothing is published."
            exit 1
          fi
          echo "Signed with the approved release key."
          echo "publish=true" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish
    needs: [checks, review-gate, release-identity]
    # Only a build signed with the approved release key; a build signed with the public key stops here.
    if: needs.release-identity.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Forget the checkout token
        # Inline, not a script of the commit: nothing of the commit has run yet. (persist-credentials:
        # false is not used because actions/checkout then fails on Nuvio's libass-android gitlink,
        # which has no URL in .gitmodules.)
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the signed and tested APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuvio-plus-{apk,update-check,emulator,gate}
          merge-multiple: true
          path: dist

      - name: Check they are the APKs that were signed and tested
        env:
          EXPECTED: ${{ needs.checks.outputs.manifest }}
          CERTIFICATE: ${{ needs.checks.outputs.certificate }}
        run: |
          [[ -n "${EXPECTED}" && "$(sha256sum dist/signed.sha256 | cut -c1-64)" == "${EXPECTED}" ]] \
            || { echo "::error::The APK list does not match the sign job"; exit 1; }
          (cd dist && sha256sum --check --strict signed.sha256)
          [[ "$(ls dist/*.apk | wc -l)" -eq 4 ]] || { echo "::error::Expected 4 APKs"; exit 1; }
          [[ "${CERTIFICATE}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No certificate from the sign job"; exit 1; }
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          for apk in dist/*.apk; do
            "${tools}/apksigner" verify "${apk}"
            cert="$(python3 -I .github/plus/apk-certs.py --current "${apk}")"
            [[ "${cert}" == "${CERTIFICATE}" ]] || { echo "::error::${apk} is not signed with ${CERTIFICATE}"; exit 1; }
          done

      - name: Publish release
        env:
          PLUS_CHANNEL: ${{ github.ref_name == 'plus-beta' && 'beta' || 'stable' }}
          BUILD: ${{ needs.checks.outputs.build_number }}
        run: bash .github/plus/publish-release.sh "${BUILD}" "${GITHUB_SHA}" dist

  report-failure:
    name: Report a failed build
    needs: [branch, checks, review-gate, release-identity, publish]
    if: failure() && needs.branch.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD: ${{ needs.checks.outputs.build_number }}
      RESULTS: "Checks: ${{ needs.checks.result }} · Review gate: ${{ needs.review-gate.result }} · Signing identity: ${{ needs.release-identity.result }} · Publish: ${{ needs.publish.result }}"
    steps:
      - name: Get the logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: '*log*'
          merge-multiple: true
          path: logs

      - name: Publish the errors as a pre-release
        run: |
          build="${BUILD:-run${GITHUB_RUN_NUMBER}}"
          [[ "${build}" =~ ^(run)?[0-9]+$ ]] || build="run${GITHUB_RUN_NUMBER}"
          {
            echo "Build ${build} at \`${GITHUB_SHA::7}\` did not pass its checks, so nothing was published. The previous build stays current."
            echo
            echo "${RESULTS}"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat logs/build.log logs/tests.log 2>/dev/null \
              | grep -E "^e: |error:|What went wrong|Execution failed|Unresolved reference|FAILED|> Task .*FAILED|AssertionError" -A3 \
              | head -c 60000 || true
            echo '```'
            if [[ -f logs/emulator.log ]]; then
              echo
              echo "Emulator log (end):"
              echo '```'
              tail -n 80 logs/emulator.log
              echo '```'
            fi
          } > errors.md
          gh release delete "build-failed-${build}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create "build-failed-${build}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --prerelease --title "Build ${build} failed its checks" --notes-file errors.md
