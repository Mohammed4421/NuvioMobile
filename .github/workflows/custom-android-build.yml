name: Build Custom APK

# Publishing builds. A push to custom-subtitles publishes a stable release, a push to plus-beta a
# beta pre-release, and only when every check passes and every Nuvio merge review is approved
# (see plus-build.yml). Both branches change only through reviewed pull requests.
on:
  push:
    branches: [custom-subtitles, plus-beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      allow_key_change:
        description: Accept a new signing certificate (users then reinstall once)
        type: boolean
        default: false

concurrency:
  group: nuvio-plus-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/plus-build.yml
    with:
      ref: ${{ github.sha }}
      publish: true
      channel: ${{ github.ref_name == 'plus-beta' && 'beta' || 'stable' }}
      allow_key_change: ${{ inputs.allow_key_change || false }}
    secrets: inherit
