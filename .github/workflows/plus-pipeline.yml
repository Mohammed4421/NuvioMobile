name: Nuvio Plus pipeline

# Daily check for new Nuvio releases. This file also lives on the repository's default branch,
# because GitHub runs scheduled workflows only from there; the logic itself is plus-sync.yml on
# the custom-subtitles branch.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Nuvio releases to follow
        type: choice
        options: [stable, beta]
        default: stable
      approve:
        description: Promote even though Nuvio and Nuvio Plus overlap (after a review)
        type: boolean
        default: false

concurrency:
  group: nuvio-plus-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Mohammed4421/NuvioMobile'
    uses: Mohammed4421/NuvioMobile/.github/workflows/plus-sync.yml@custom-subtitles
    with:
      # Scheduled runs always follow stable releases; betas only when chosen by hand.
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
      approve: ${{ github.event_name == 'workflow_dispatch' && inputs.approve || false }}
    secrets: inherit
