name: Nuvio Plus build and checks

# Builds a commit, runs every check and, when asked, publishes the APKs. Nothing is published
# unless the build, every unit test, the update check and the emulator tests pass. The unit tests of
# the Nuvio release the commit is based on also run, only to tell inherited failures apart in the
# report; they never excuse a failing test.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      publish:
        description: Publish a release when every check passes
        required: true
        type: boolean
      note:
        description: Extra line for the release notes
        required: false
        type: string
        default: ''
      allow_key_change:
        description: Accept a new signing certificate (users then reinstall once)
        required: false
        type: boolean
        default: false
      channel:
        description: stable (custom-N releases) or beta (custom-N-beta pre-releases)
        required: false
        type: string
        default: stable
    outputs:
      build_number:
        value: ${{ jobs.build.outputs.build_number }}

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.number.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Build number
        id: number
        run: echo "build=$(bash .github/plus/next-build-number.sh)" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing and properties
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.CUSTOM_KEYSTORE_BASE64 }}
          CUSTOM_KEYSTORE_PASSWORD: ${{ secrets.CUSTOM_KEYSTORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.CUSTOM_KEY_ALIAS }}
          CUSTOM_LOCAL_PROPERTIES: ${{ secrets.CUSTOM_LOCAL_PROPERTIES }}
          PLUS_CHANNEL: ${{ inputs.channel }}
        run: bash .github/plus/prepare-build.sh "${{ steps.number.outputs.build }}"

      - name: Build APKs
        run: |
          set -o pipefail
          build="${{ steps.number.outputs.build }}"
          version="$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Version.xcconfig | tr -d '[:space:]')"
          ./gradlew :androidApp:assembleFullRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pnuvio.applicationIdSuffix=.plus \
            -Pnuvio.customVersionCode=$((1000 + build)) \
            -Pnuvio.customVersionName="${version}-plus.${build}$([[ "${{ inputs.channel }}" == beta ]] && echo -beta)" \
            --stacktrace 2>&1 | tee build.log
          echo "- Build: release APKs for 4 ABIs, version ${version}-plus.${build} (${{ inputs.channel }})." > checks.md

      - name: Name the APKs
        run: |
          mkdir -p dist
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            abi="$(basename "${apk}" .apk | sed -E 's/^androidApp-full-//; s/-release$//')"
            cp "${apk}" "dist/NuvioPlus-build${{ steps.number.outputs.build }}-${abi}.apk"
          done
          ls -l dist

      - name: Update check (signature, package, version)
        env:
          ALLOW_KEY_CHANGE: ${{ inputs.allow_key_change }}
          PLUS_CHANNEL: ${{ inputs.channel }}
        run: bash .github/plus/check-update-compat.sh dist/*arm64-v8a.apk

      - name: Keep the APKs and checks
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-plus-apk
          path: |
            dist/*.apk
            checks.md
          if-no-files-found: error
          retention-days: 14

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-plus-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

  plus-tests:
    name: Unit tests of Nuvio Plus
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Robolectric needs Java 21 for its Android 15 and 16 tests.
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (all of them)
        env:
          GH_TOKEN: ${{ github.token }}
          PLUS_CHANNEL: ${{ inputs.channel }}
        run: |
          # Exactly the settings of the published build, Nuvio Plus updater source included.
          bash .github/plus/prepare-build.sh "$(bash .github/plus/next-build-number.sh)"
          grep '^PLUS_' local.properties
          timeout 30m ./gradlew :composeApp:testAndroidHostTest \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            --continue > tests.log 2>&1 || true
          tail -n 30 tests.log
          grep -q "BUILD SUCCESSFUL\|There were failing tests" tests.log || { echo "::error::Unit tests did not finish (timeout or build error)"; exit 1; }
          python3 .github/plus/test-results.py composeApp/build/test-results plus-tests.json

      - name: Keep the results
        uses: actions/upload-artifact@v7
        with:
          name: plus-tests
          path: plus-tests.json
          if-no-files-found: error
          retention-days: 14

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plus-tests-log
          path: tests.log
          if-no-files-found: ignore
          retention-days: 14

  nuvio-tests:
    name: Unit tests of the Nuvio release it is based on
    timeout-minutes: 45
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.base.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Find the Nuvio release
        id: base
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git fetch --quiet --tags upstream
          cp .github/plus/select-upstream-tag.py "${RUNNER_TEMP}/"
          tag="$(git tag --merged HEAD | python3 "${RUNNER_TEMP}/select-upstream-tag.py" beta)"
          [[ -n "${tag}" ]] || { echo "::error::No Nuvio release found in this commit"; exit 1; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          cp .github/plus/test-results.py "${RUNNER_TEMP}/"
          git checkout --quiet "${tag}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: |
          touch local.properties
          timeout 30m ./gradlew :composeApp:testAndroidHostTest \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            --continue > tests.log 2>&1 || true
          tail -n 30 tests.log
          python3 "${RUNNER_TEMP}/test-results.py" composeApp/build/test-results nuvio-tests.json

      - name: Keep the results
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-tests
          path: nuvio-tests.json
          if-no-files-found: error
          retention-days: 14

  test-gate:
    name: All unit tests pass
    timeout-minutes: 10
    needs: [plus-tests, nuvio-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Get the results
        uses: actions/download-artifact@v8
        with:
          pattern: '*-tests'
          merge-multiple: true
          path: results

      - name: Compare
        run: python3 .github/plus/test-gate.py results/plus-tests.json results/nuvio-tests.json "${{ needs.nuvio-tests.outputs.tag }}"

      - name: Keep the summary
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-plus-gate
          path: checks-tests.md
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Install, update and launch on an emulator
    timeout-minutes: 30
    needs: [build, test-gate]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Get the new APKs
        uses: actions/download-artifact@v8
        with:
          name: nuvio-plus-apk
          path: dist

      - name: Get the previous build
        id: previous
        run: |
          tag="$(PLUS_CHANNEL="${{ inputs.channel }}" bash .github/plus/previous-release.sh)"
          apk=""
          if [[ -n "${tag}" && "${{ inputs.allow_key_change }}" != "true" ]]; then
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir previous --pattern '*x86_64*.apk' --clobber
            apk="$(ls previous/*.apk | head -n 1)"
          fi
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"
          # The artifact keeps its dist/ folder: the APKs land in dist/dist/.
          new="$(find dist -name '*x86_64*.apk' | head -n 1)"
          [[ -n "${new}" ]] || { echo "::error::No x86_64 APK in the build artifact"; ls -R dist; exit 1; }
          echo "new=${new}" >> "${GITHUB_OUTPUT}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/plus/emulator-update-test.sh "${{ steps.previous.outputs.apk }}" "${{ steps.previous.outputs.new }}"

      - name: Keep the emulator result
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-plus-emulator
          path: checks-emulator.md
          if-no-files-found: error
          retention-days: 14

      - name: Keep the emulator log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-log
          path: |
            emulator.log
            crash.log
            screens/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish
    timeout-minutes: 15
    needs: [build, test-gate, emulator]
    if: inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Get the tested APKs
        uses: actions/download-artifact@v8
        with:
          pattern: nuvio-plus-{apk,emulator,gate}
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          PLUS_CHANNEL: ${{ inputs.channel }}
        run: |
          find dist -mindepth 2 -name '*.apk' -exec mv -t dist {} +
          ls -l dist
          [[ "$(ls dist/*.apk | wc -l)" -eq 4 ]] || { echo "::error::Expected 4 APKs"; exit 1; }
          bash .github/plus/publish-release.sh "${{ needs.build.outputs.build_number }}" "$(git rev-parse HEAD)" dist "${{ inputs.note }}"

  report-failure:
    name: Report a failed build
    timeout-minutes: 10
    needs: [build, plus-tests, nuvio-tests, test-gate, emulator, review-gate]
    if: failure() && inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Get the logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: '*log*'
          merge-multiple: true
          path: logs

      - name: Publish the errors as a pre-release
        run: |
          build="${{ needs.build.outputs.build_number }}"
          build="${build:-run${GITHUB_RUN_NUMBER}}"
          sha="${{ inputs.ref }}"
          {
            echo "Build ${build} at \`${sha::7}\` did not pass its checks, so nothing was published. The previous build stays current."
            echo
            echo "Build: ${{ needs.build.result }} · Nuvio Plus tests: ${{ needs.plus-tests.result }} · Nuvio tests: ${{ needs.nuvio-tests.result }} · Test gate: ${{ needs.test-gate.result }} · Emulator: ${{ needs.emulator.result }} · Reviews: ${{ needs.review-gate.result }}"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat logs/build.log logs/tests.log 2>/dev/null \
              | grep -E "^e: |error:|What went wrong|Execution failed|Unresolved reference|FAILED|> Task .*FAILED|AssertionError" -A3 \
              | head -c 60000 || true
            echo '```'
            if [[ -f logs/emulator.log ]]; then
              echo
              echo "Emulator log (end):"
              echo '```'
              tail -n 80 logs/emulator.log
              echo '```'
            fi
          } > errors.md
          gh release delete "build-failed-${build}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create "build-failed-${build}" --repo "${GITHUB_REPOSITORY}" --target "${sha}" \
            --prerelease --title "Build ${build} failed its checks" --notes-file errors.md
