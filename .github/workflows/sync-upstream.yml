name: Sync with Nuvio

# Merges new Nuvio releases into Nuvio Plus and builds an update. Runs every day; also from the
# Actions tab. A conflict is reported as an issue (when issues are enabled) and as a
# "sync-needed" pre-release, and nothing is published.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: Nuvio branch to follow (main = stable releases, cmp-rewrite = betas)
        default: main

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/NuvioMedia/NuvioMobile.git
  UPSTREAM_BRANCH: ${{ inputs.branch || 'main' }}
  TARGET_BRANCH: custom-subtitles

jobs:
  sync:
    name: Merge Nuvio updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nuvio Plus
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          upstream_sha="$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")"
          echo "sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Already up to date with Nuvio ${UPSTREAM_BRANCH} (${upstream_sha})."
            echo "status=current" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git merge --no-edit -m "Merge Nuvio ${UPSTREAM_BRANCH} (${upstream_sha})" "upstream/${UPSTREAM_BRANCH}"; then
            echo "status=merged" >> "${GITHUB_OUTPUT}"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "status=conflict" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push the merge
        id: push
        if: steps.merge.outputs.status == 'merged'
        run: |
          # GitHub does not let this token change workflow files; such updates are merged by hand.
          if git push origin "HEAD:${TARGET_BRANCH}" 2> push.log; then
            echo "status=pushed" >> "${GITHUB_OUTPUT}"
          else
            cat push.log
            echo "status=failed" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build the update
        if: steps.push.outputs.status == 'pushed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run custom-android-build.yml --ref "${TARGET_BRANCH}" --repo "${GITHUB_REPOSITORY}"

      - name: Report what needs a hand
        if: steps.merge.outputs.status == 'conflict' || steps.push.outputs.status == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.merge.outputs.sha }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          title="Nuvio update ${SHA} needs a manual merge"
          tag="sync-needed-${SHA}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Already reported."
            exit 1
          fi
          {
            echo "Nuvio \`${UPSTREAM_BRANCH}\` moved to ${SHA}, and the update could not be merged into Nuvio Plus automatically."
            echo
            if [[ "${STATUS}" == "conflict" ]]; then
              echo "These files were changed both by Nuvio and by Nuvio Plus:"
              echo
              sed 's/^/- `/; s/$/`/' conflicts.txt
            else
              echo "The merge changes workflow files, which this workflow is not allowed to push."
            fi
            echo
            echo "Nothing was published; the current Nuvio Plus build keeps working."
          } > issue.md
          # An issue notifies the owner when issues are enabled; a pre-release (ignored by the in-app
          # updater) is always visible on the Releases page.
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file issue.md || true
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${TARGET_BRANCH}" \
            --title "${title}" --notes-file issue.md --prerelease
          exit 1
