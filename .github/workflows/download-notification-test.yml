# Owner's download contract (Build 15), condition 9: pause and resume from the notification while
# the app is in the background, on the Android 14 and 9 emulators against the debug app of the pull
# request (.github/plus/notification-pause-test.sh): taps the real notification buttons, checks the
# stored state, that the partial file is kept and resumed from its offset, and the final SHA-256.
# No secret, no write permission; the debug key is made by the build tools and thrown away.
name: Download notification test
on:
  pull_request:
    branches: [custom-subtitles]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: download-notification-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the debug app and its device tests
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Forget the checkout token
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Take the Sentry plugin from Maven Central
        run: |
          mkdir -p "${HOME}/.gradle/init.d"
          cp ".github/plus/plugins-from-central.init.gradle" "${HOME}/.gradle/init.d/"

      - name: Prepare properties (no signing settings)
        run: bash .github/plus/prepare-build.sh "$(bash .github/plus/next-build-number.sh)"

      - name: Build
        run: |
          set -o pipefail
          bash .github/plus/gradle-retry.sh device-test-build.log ./gradlew \
            :androidApp:assembleFullDebug :androidApp:assembleFullDebugAndroidTest \
            -Dorg.gradle.jvmargs="-Xmx10g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace || {
              { grep -E "^e: " device-test-build.log || true; } | head -n 8 | sed 's/^/::error::/'
              exit 1
            }
          mkdir -p device-test
          cp "$(find androidApp/build/outputs/apk/full/debug -name '*.apk' | head -n 1)" device-test/debug-app.apk
          cp "$(find androidApp/build/outputs/apk/androidTest/full/debug -name '*.apk' | head -n 1)" device-test/debug-test.apk

      - name: Keep the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: download-notification-apks
          path: device-test
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: Notification pause/resume (Android ${{ matrix.api }}${{ matrix.api >= 34 && ', pause only' || '' }})
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 28 and 34 as before (28 is a required check); 36 (Android 16) for compatibility.
        # Android 17 (37) is NOT TESTED here: on the android-37.0 google_apis image system_server loses
        # its services right after boot (SurfaceFlinger abort in the goldfish mapper with
        # swiftshader_indirect; 'Can't find service: settings/input' with swangle_indirect) before the
        # app is installed (PR #63 runs). The 37 settings below stay so it can be re-added to the list
        # when a fixed image ships; until then Android 17 needs a real device.
        api: [34, 28, 36]
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Forget the checkout token
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: download-notification-apks
          path: device-test

      - name: Emulator image for Android ${{ matrix.api }} exists
        # Android 16 (API 36) and 17 (API 37) are compatibility runs (owner, 2026-11-21). A missing
        # system image fails here with NOT TESTED; it is never treated as a pass.
        env:
          API: ${{ matrix.api == 37 && '37.0' || matrix.api }}
        run: |
          image="system-images;android-${API};google_apis;x86_64"
          listing="$("${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null || true)"
          echo "Images for API ${API}:"; grep -F "system-images;android-${API}" <<< "${listing}" | sed 's/^/  /' | sort -u || true
          if ! grep -qF "${image}" <<< "${listing}"; then
            echo "::error::Android ${API}: ${image} is not available from the SDK manager; NOT TESTED"
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          LABEL: android-${{ matrix.api }}
          # Android 14: Pause only (see the script's header); Android 9: the whole scenario.
          MODE: ${{ matrix.api >= 34 && 'pause-only' || 'full' }}
        with:
          # Android 17's SDK packages are named android-37.0.
          api-level: ${{ matrix.api == 37 && '37.0' || matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Android 16's long-running notification/interruptions test lost ADB (run 45242717925).
          # Use the supported software renderer for API 36 instead of the deprecated
          # swiftshader_indirect mode. API 28/34 keep their previously passing renderer.
          # Android 17 stays excluded pending a bootable image; its separate swangle path stays.
          emulator-options: -no-window -gpu ${{ matrix.api == 37 && 'swangle_indirect' || matrix.api == 36 && 'software' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -no-snapshot
          # Android 17's image did not boot within 600 s with the default 2 cores (run of 38f059c9).
          cores: ${{ matrix.api == 37 && 4 || 2 }}
          ram-size: ${{ matrix.api == 37 && '4096M' || '' }}
          emulator-boot-timeout: ${{ matrix.api == 37 && 1200 || 600 }}
          # Android 17's default data partition could not hold the debug app (run of e228cded:
          # "Requested internal only, but not enough space").
          disk-size: ${{ matrix.api == 37 && '8G' || '' }}
          # Then the same download through the network going away and the app process dying.
          script: bash .github/plus/notification-pause-test.sh device-test/debug-app.apk "$LABEL" "$MODE" && bash .github/plus/download-interruptions-test.sh device-test/debug-app.apk "$LABEL"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: download-notification-log-${{ matrix.api }}
          path: |
            notification-pause-*
            download-interruptions-*
          if-no-files-found: warn
          retention-days: 14
