# Build 15, P5 / P0-04: start-up time, memory and APK size of the pull request's release APK against
# the published Build 14 APK, on the same emulator, measured in alternating blocks (14, head, 14,
# head, ...) so drift of the emulator affects both alike (.github/plus/measure-app.sh), then compared
# with the noise margin (.github/plus/measure-compare.py). The head APK is the one the pull request's
# own "Nuvio Plus checks" run built and signed (no new build, no secret). Emulator numbers describe
# the relative change only; real-device performance stays NEEDS PHYSICAL DEVICE.
# A difference is reported (warning), not failed: the numeric limits are set from these baselines.
name: Performance compare
on:
  pull_request:
    branches: [custom-subtitles]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/performance-compare.yml
      - .github/plus/measure-app.sh
      - .github/plus/measure-compare.py
  workflow_dispatch:
    inputs:
      checks_run:
        description: Id of the "Nuvio Plus checks" run whose nuvio-plus-apk artifact is measured
        required: true

concurrency:
  group: performance-compare-${{ github.event_name }}-${{ github.ref }}-${{ inputs.checks_run }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apks:
    name: Get the Build 14 and head APKs
    timeout-minutes: 150
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CHECKS_RUN: ${{ inputs.checks_run }}
    steps:
      - name: Build 14 (published release)
        run: |
          set -euo pipefail
          mkdir -p apks
          gh release download custom-14 --repo "${REPO}" --pattern 'NuvioPlus-build14-x86_64.apk' --dir apks
          mv apks/NuvioPlus-build14-x86_64.apk apks/build14.apk

      - name: Head (the pull request's own checks run)
        run: |
          set -euo pipefail
          run="${CHECKS_RUN}"
          if [[ -z "${run}" ]]; then
            # Waits for the checks run of this exact commit to sign its APKs.
            for _ in $(seq 1 130); do
              run="$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=30" \
                --jq '[.workflow_runs[] | select(.name == "Nuvio Plus checks")] | sort_by(.id) | last | .id // empty')"
              if [[ -n "${run}" ]] && gh api "repos/${REPO}/actions/runs/${run}/artifacts" \
                   --jq '.artifacts[].name' | grep -qx nuvio-plus-apk; then break; fi
              run=""; sleep 60
            done
            [[ -n "${run}" ]] || { echo "::error::No signed APK from the checks run of ${HEAD_SHA}"; exit 1; }
          fi
          [[ "${run}" =~ ^[0-9]+$ ]] || { echo "::error::Not a run id: ${run}"; exit 1; }
          gh run download "${run}" --repo "${REPO}" --name nuvio-plus-apk --dir signed
          cp "$(ls signed/NuvioPlus-build*-x86_64.apk | head -n 1)" apks/head.apk
          {
            echo "Checks run: ${run} ($(gh api "repos/${REPO}/actions/runs/${run}" --jq .head_sha))"
            (cd apks && sha256sum build14.apk head.apk)
            # Size of each APK and of the entries that make it up (dex stored, libraries compressed).
            python3 -I -c '
          import sys, zipfile
          for path in sys.argv[1:]:
              z = zipfile.ZipFile(path)
              dex = sum(i.file_size for i in z.infolist() if i.filename.endswith(".dex"))
              libs = sum(i.compress_size for i in z.infolist() if i.filename.endswith(".so"))
              res = sum(i.compress_size for i in z.infolist() if i.filename.startswith("res/") or i.filename == "resources.arsc")
              import os
              print(f"{os.path.basename(path)}: {os.path.getsize(path)} bytes; dex {dex}; native libraries {libs} (compressed); resources {res}; {len(z.infolist())} entries")
          ' apks/build14.apk apks/head.apk
          } | tee apks/source.txt

      - name: Keep the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-apks
          path: apks
          if-no-files-found: error
          retention-days: 3

  measure:
    name: Measure (Android ${{ matrix.api }})
    needs: apks
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [34, 28]
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Forget the checkout token
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: performance-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure in alternating blocks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: for b in 1 2 3 4 5; do bash .github/plus/measure-app.sh apks/build14.apk build14 2 com.nuvio.app.plus; bash .github/plus/measure-app.sh apks/head.apk head 2 com.nuvio.app.plus; done | tee measure.log

      - name: Compare
        env:
          API: ${{ matrix.api }}
        run: |
          set -o pipefail
          cat apks/source.txt
          status=0
          python3 -I .github/plus/measure-compare.py build14 head < measure.log | tee compare.md || status=$?
          { echo "### Android ${API}: Build 14 against the head (emulator, relative only)"; cat apks/source.txt; echo; grep -v '^COMPARE ' compare.md; } >> "${GITHUB_STEP_SUMMARY}"
          sed -n 's/^COMPARE //p' compare.md | python3 -I -c '
          import json, sys
          for r in json.load(sys.stdin):
              if r["verdict"] == "higher":
                  print("::warning::{}: {} -> {} ({} %), above the noise margin".format(r["metric"], r["before_median"], r["after_median"], r["change_pct"]))'
          exit "${status}"

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.api }}
          path: |
            measure.log
            compare.md
          if-no-files-found: warn
          retention-days: 30
