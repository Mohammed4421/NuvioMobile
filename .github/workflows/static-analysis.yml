# Build 15, P8-01: static analysis. Android lint (app and the modules it depends on) of the pull
# request head and of Build 14 (18276c69), each in its own checkout with its own build scripts, then
# compared (.github/plus/lint-compare.py): a new Fatal or Error finding, or any new Security finding,
# fails; other new findings are listed. No secret, no write permission, nothing published.
name: Static analysis
on:
  pull_request:
    branches: [custom-subtitles]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.side }})
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: build14
            ref: 18276c6944915b5b0110fd94d243cc94619281b9
          - side: head
            ref: ""
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.ref }}
          path: src

      - name: Forget the checkout token (src)
        run: |
          git -C src config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git -C src config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git -C src config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git -C src config --local --unset-all
          left="$(git -C src config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Check out this workflow's scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/plus/lint-report.init.gradle
            .github/plus/plugins-from-central.init.gradle

      - name: Forget the checkout token (tools)
        run: |
          git -C tools config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git -C tools config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git -C tools config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git -C tools config --local --unset-all
          left="$(git -C tools config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/custom-subtitles' || github.ref == 'refs/heads/plus-beta')) }}

      - name: Init scripts
        run: |
          mkdir -p "${HOME}/.gradle/init.d"
          cp tools/.github/plus/plugins-from-central.init.gradle tools/.github/plus/lint-report.init.gradle "${HOME}/.gradle/init.d/"

      - name: Prepare properties (no signing settings)
        working-directory: src
        run: bash .github/plus/prepare-build.sh "$(bash .github/plus/next-build-number.sh 2>/dev/null || echo 15)"

      - name: Lint tasks of the modules (which modules lint covers)
        working-directory: src
        run: |
          ./gradlew -q :composeApp:tasks --all -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore 2>/dev/null \
            | grep -iE '^lint' || echo "no lint task listed for composeApp"

      - name: Lint
        working-directory: src
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -o pipefail
          bash .github/plus/gradle-retry.sh lint.log ./gradlew :androidApp:lintFullRelease \
            -Dorg.gradle.jvmargs="-Xmx10g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore \
            -Pnuvio.applicationIdSuffix=.plus -Pnuvio.minSdk=28 --stacktrace || {
              { grep -E "^e: |FAILURE|What went wrong" -A3 lint.log || true; } | head -n 8 | sed 's/^/::error::/'
              exit 1
            }
          [[ -s lint-results.xml ]] || { echo "::error::No lint report written"; exit 1; }
          mkdir -p ../out && cp lint-results.xml "../out/lint-${SIDE}.xml"
          echo "${GITHUB_WORKSPACE}/src" > "../out/root-${SIDE}.txt"

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-${{ matrix.side }}
          path: out
          if-no-files-found: error
          retention-days: 30

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-log-${{ matrix.side }}
          path: src/lint.log
          if-no-files-found: ignore
          retention-days: 14

  compare:
    name: Lint findings against Build 14
    needs: lint
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Forget the checkout token
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $2}' | xargs -r rm -f
          { git config --local --get-regexp '^includeif\.' || true; } | awk '{print $1}' | xargs -r -n1 git config --local --unset-all
          left="$(git config --list --includes | grep -ci 'authorization' || true)"
          if [[ "${left}" != 0 ]]; then echo "::error::A Git token is still stored"; exit 1; fi

      - name: Get the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lint-*
          merge-multiple: true
          path: reports

      - name: Compare
        run: |
          set -o pipefail
          status=0
          python3 -I .github/plus/lint-compare.py reports/lint-build14.xml "$(cat reports/root-build14.txt)" \
            reports/lint-head.xml "$(cat reports/root-head.txt)" | tee lint-compare.md || status=$?
          { echo "### Android lint: head against Build 14"; grep -v '^LINT ' lint-compare.md; } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Keep the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-compare
          path: lint-compare.md
          if-no-files-found: warn
          retention-days: 30
